server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64M;

    # Header keamanan dasar. CSP tidak dipasang di sini karena berbeda antara
    # halaman admin dan publik — itu urusan middleware aplikasi.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # storage/ hanya boleh diakses lewat symlink public/storage. Berkas privat
    # (dokumen) tidak pernah berada di sana — hanya lewat route download.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/cms_error.log;
    access_log /var/log/nginx/cms_access.log;
}
