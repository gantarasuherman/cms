server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64M;

    # DNS internal Docker, ditanyai ulang setiap 10 detik.
    #
    # Tanpa ini nginx menerjemahkan "php-fpm" SEKALI saat start lalu memegang
    # alamat IP itu selamanya. Begitu container php-fpm dibuat ulang — dan itu
    # terjadi pada hampir setiap `docker compose up` — ia mendapat IP baru,
    # sementara nginx masih mengetuk alamat lama. Hasilnya 502 pada segalanya
    # sampai seseorang kebetulan me-restart nginx.
    #
    # Ini juga yang diam-diam mematikan chatbot: layanan bot berbicara kepada
    # Laravel lewat nginx, jadi 502 di sini berarti bot naik tanpa kredensial
    # dan outbox tidak pernah terkuras — tanpa satu pun tanda bahwa ada yang
    # rusak, sebab botnya sendiri berjalan normal.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Header keamanan dasar. CSP tidak dipasang di sini karena berbeda antara
    # halaman admin dan publik — itu urusan middleware aplikasi.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Lewat variabel, dengan sengaja: fastcgi_pass yang ditulis harfiah
        # diselesaikan saat memuat konfigurasi, sedangkan yang memakai variabel
        # diselesaikan pada setiap permintaan — dan itulah yang membuat nginx
        # mengikuti php-fpm ketika containernya berpindah alamat.
        set $upstream_php php-fpm:9000;
        fastcgi_pass $upstream_php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # storage/ hanya boleh diakses lewat symlink public/storage. Berkas privat
    # (dokumen) tidak pernah berada di sana — hanya lewat route download.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/cms_error.log;
    access_log /var/log/nginx/cms_access.log;
}
